{% extends 'base.html' %}

{% block content %}

<div class="col-sm-9">
  <div class="blog-post-area">
    <h2 class="title text-center">Thêm sản phẩm mới</h2>
    <div class="signup-form">
      <h2>Điền thông tin sản phẩm muốn thêm!</h2>
      <form action="" method="POST" id="productAdd" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="name">Tên sản phẩm</label>
        <input type="text" name="productname" id="name" required>
        <p id="error-name"></p>

        <label for="price">Giá</label>
        <input type="number" name="productprice" id="price" required>
        <p id="error-price"></p>

        <label for="category">Loại sản phẩm</label>
        <select name="productcategory" id="">
            <option value="">Loại</option>
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
        <p id="error-category"></p>

        <label for="brand">Thương hiệu sản phẩm</label>
        <select name="productbrand" id="">
            <option value="">Thương hiệu</option>
            {% for brand in brands %}
                <option value="{{ brand.id }}">{{ brand.name }}</option>
            {% endfor %}
        </select>
        <p id="error-brand"></p>

        <label for="status">Trạng thái sản phẩm</label>
        <select name="productstatus" id="">
            <option value="0">New</option>
            <option value="1">Sale</option>
        </select>
        
        <div id="sale-input" style="display: none;">
            <input type="text" name="productsale" placeholder="0">
            <p id="error-sale"></p>
        </div>

        <label for="company">Công ty</label>
        <input type="text" name="productcompany" id="company" required>
        <p id="error-company"></p>

        <label for="file">Ảnh sản phẩm</label>
        <input type="file" name="productimages" id="images" multiple>
        <p id="error-images"></p>

        <label for="detail">Chi tiết sản phẩm</label>
        <textarea name="productdetail" id="detail"></textarea>
        <p id="error-detail"></p>

        <button type="submit" class="btn btn-default">Thêm sản phẩm</button>

      </form>
    </div>
  </div>
</div>

    <script>
        $(document).ready(function() {
            const status = document.getElementById('status');
            const saleInput = document.getElementById('sale-input');
            status.addEventListener('change', function() {
                if(this.value == 1) {
                    saleInput.style.display = "block";
                } else {
                    saleInput.style.display = "none";
                }
            });

            $('form#productAdd').on('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                $('form#productAdd p').text("");
                $.ajax({
                    url: "/products/account/add-product/",
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    success: function(data) {
                        if(data.success) {
                            alert("Thêm sản phẩm mới thành công!")
                            $('form#productAdd')[0].reset();
                            $('form#productAdd p').text("");
                            $('#sale-input').hide();
                        }
                    },
                    error: function(xhr) {
                        if(xhr.responseJSON && xhr.responseJSON.errors) {
                            const errors = xhr.responseJSON.errors;
                            $.each(errors, function(field, message) {
                                $('#error-' + field).text(message);
                            });
                        }
                    }
                })
            })
        })
    </script>

{% endblock %}
